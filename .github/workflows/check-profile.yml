name: Check profile generator

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin
      - run: npm run verify
